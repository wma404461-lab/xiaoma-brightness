<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>Xiaoma Brightness — Horse, display and sunlight</title>
  <defs>
    <linearGradient id="tile" x1="62" y1="32" x2="454" y2="506" gradientUnits="userSpaceOnUse">
      <stop stop-color="#233E4E"/><stop offset="1" stop-color="#10232F"/>
    </linearGradient>
    <linearGradient id="screen" x1="102" y1="194" x2="398" y2="370" gradientUnits="userSpaceOnUse">
      <stop stop-color="#268F91"/><stop offset="1" stop-color="#15596A"/>
    </linearGradient>
    <linearGradient id="rim" x1="94" y1="154" x2="404" y2="386" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D4F3E9"/><stop offset="1" stop-color="#83BFC0"/>
    </linearGradient>
    <linearGradient id="horse-coat" x1="173" y1="190" x2="281" y2="352" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#E3EEE9"/>
