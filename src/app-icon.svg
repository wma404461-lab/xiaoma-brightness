    <linearGradient id="sun" x1="336" y1="214" x2="368" y2="258" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFE8A0"/><stop offset="1" stop-color="#F6B955"/>
    </linearGradient>
  </defs>
  <rect id="background" x="16" y="16" width="480" height="480" rx="112" fill="url(#tile)"/>
  <rect x="17" y="17" width="478" height="478" rx="111" fill="none" stroke="#FFFFFF" stroke-opacity=".09" stroke-width="2"/>
  <g id="monitors">
