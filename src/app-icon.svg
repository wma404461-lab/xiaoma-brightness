  <g id="horse-portrait">
    <path id="mane" d="M150 352H129C136 337 139 324 137 307C135 284 149 271 157 260C167 247 172 228 175 211L181 220C181 244 176 261 165 282C153 303 151 326 150 352Z" fill="#B6DAD0"/>
    <path id="horse" d="M149 352C153 322 145 299 159 275C166 262 173 247 176 230C165 218 168 204 179 195L187 176L208 202L221 185C234 190 241 202 241 214C258 220 271 236 282 246L310 262C323 268 325 279 315 286L296 298C285 305 273 298 260 282C255 311 268 333 286 352Z" fill="url(#horse-coat)"/>
    <path id="ear-detail" d="M185 195L188 187L199 203Z" fill="#A6C7BE"/>
    <path id="cheek" d="M258 277C262 265 267 260 276 258C269 274 271 285 280 291C273 288 265 282 258 277Z" fill="#BAD9D2"/>
    <path id="mane-detail" d="M166 273C179 252 184 232 183 216" fill="none" stroke="#2B7B80" stroke-width="5" stroke-linecap="round"/>
