    <rect x="76" y="160" width="344" height="232" rx="30" fill="#091A24" fill-opacity=".4" transform="translate(0 8)"/>
    <rect id="front-monitor" x="76" y="156" width="344" height="232" rx="30" fill="url(#rim)"/>
    <rect id="display" x="92" y="172" width="312" height="196" rx="16" fill="url(#screen)"/>
    <path d="M107 173H389Q403 173 403 187" fill="none" stroke="#FFFFFF" stroke-opacity=".12" stroke-width="2"/>
